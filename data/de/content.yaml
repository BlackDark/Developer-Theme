Profile: |
  Cloud Architekt & DevOps Engineer mit umfangreicher Erfahrung in Softwareentwicklung und Cloud-Technologien (Erfahrung 10+ Jahre). 
  Aktuell Gründer der raydak GmbH, spezialisiert auf professionelle Cloud-Architektur und Beratung, insbesondere mit AWS. 
  Erfahren in der Implementierung moderner Technologie-Stacks, Containerisierung und Automatisierungslösungen. 
  Fundierter Hintergrund in Full-Stack-Entwicklung und DevOps-Praktiken, mit Expertise in Kubernetes, Docker und verschiedenen Cloud-Plattformen.
  Darüber hinaus setze ich gerne verschiedene AI-Tools ein, um den Codierungsprozess zu beschleunigen und die Effizienz zu verbessern, während ich die Ergebnisse auf bewährte Praktiken überprüfe.
  Als Abschluss trage ich gerne zu OpenSource Projekten bei und bin immer auf der Suche nach neuen Herausforderungen!

